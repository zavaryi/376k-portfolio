<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>376K</title>
  <meta name="description" content="376K Experience" />

  <!-- Google Fonts: JetBrains Mono & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    /* Reset & Base Setup */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Video Container - Pixel-Perfect Hardware Accelerated */
    .video-wrapper {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      transform: translate3d(0, 0, 0);
      -webkit-transform: translate3d(0, 0, 0);
      will-change: opacity, transform;
    }

    .video-wrapper.active {
      opacity: 1;
    }

    .bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%) translate3d(0, 0, 0);
      -webkit-transform: translate(-50%, -50%) translate3d(0, 0, 0);
      object-fit: cover;
      object-position: center;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      pointer-events: none;
    }

    /* Entry Click Overlay */
    .entry-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 10, 16, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      cursor: pointer;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s ease;
    }

    .entry-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .entry-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 2.5rem 3rem;
      text-align: center;
      animation: pulseIn 2s ease-in-out infinite alternate;
    }

    @keyframes pulseIn {
      0% {
        transform: scale(0.99);
      }
      100% {
        transform: scale(1.01);
      }
    }

    .entry-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.9rem 2.2rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.08), inset 0 0 15px rgba(255, 255, 255, 0.04);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      letter-spacing: 0.05em;
    }

    .entry-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.25), inset 0 0 20px rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .btn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .entry-subtext {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Floating UI Controls */
    .controls-overlay {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      z-index: 50;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s ease 0.5s, transform 0.5s ease 0.5s;
    }

    .controls-overlay.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .ctrl-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      transform: scale(1.08);
    }

    .brand-watermark {
      position: fixed;
      top: 1.5rem;
      left: 1.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.15em;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.5s ease 0.5s;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    .brand-watermark.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Entry Screen Overlay -->
  <div class="entry-overlay" id="entryOverlay">
    <div class="entry-card">
      <button class="entry-btn" id="entryBtn" aria-label="Click to continue">
        <span class="btn-dot"></span>
        <span>click to continue...</span>
      </button>
      <div class="entry-subtext">[ 376k.xyz ]</div>
    </div>
  </div>

  <!-- Infinite Fullscreen Video Wrapper -->
  <div class="video-wrapper" id="videoWrapper">
    <video
      id="bgVideo"
      class="bg-video"
      src="portfoliobackground.mp4"
      playsinline
      webkit-playsinline
      x5-playsinline
      loop
      preload="auto"
    ></video>
  </div>

  <!-- Brand Watermark -->
  <div class="brand-watermark" id="brandWatermark">376K.XYZ</div>

  <!-- Minimal Audio & Fullscreen Floating Controls -->
  <div class="controls-overlay" id="controlsOverlay">
    <button class="ctrl-btn" id="muteToggle" title="Toggle sound" aria-label="Toggle sound">
      <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
    </button>
    <button class="ctrl-btn" id="fullscreenToggle" title="Toggle fullscreen" aria-label="Toggle fullscreen">
      <i class="fa-solid fa-expand" id="fullscreenIcon"></i>
    </button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const entryOverlay = document.getElementById('entryOverlay');
      const entryBtn = document.getElementById('entryBtn');
      const videoWrapper = document.getElementById('videoWrapper');
      const bgVideo = document.getElementById('bgVideo');
      const controlsOverlay = document.getElementById('controlsOverlay');
      const brandWatermark = document.getElementById('brandWatermark');
      const muteToggle = document.getElementById('muteToggle');
      const volumeIcon = document.getElementById('volumeIcon');
      const fullscreenToggle = document.getElementById('fullscreenToggle');
      const fullscreenIcon = document.getElementById('fullscreenIcon');

      let started = false;

      // Start Experience on Click
      const startExperience = async () => {
        if (started) return;
        started = true;

        // Hide Entry Screen
        entryOverlay.classList.add('hidden');
        videoWrapper.classList.add('active');
        controlsOverlay.classList.add('visible');
        brandWatermark.classList.add('visible');

        try {
          // Play video in infinite loop
          bgVideo.currentTime = 0;
          const playPromise = bgVideo.play();
          if (playPromise !== undefined) {
            playPromise.catch((err) => {
              console.warn('Autoplay with sound restricted, attempting muted play:', err);
              bgVideo.muted = true;
              bgVideo.play();
              updateVolumeIcon();
            });
          }
        } catch (e) {
          console.error('Playback error:', e);
        }
      };

      entryOverlay.addEventListener('click', startExperience);
      entryBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        startExperience();
      });

      // Sound Toggle
      function updateVolumeIcon() {
        if (bgVideo.muted || bgVideo.volume === 0) {
          volumeIcon.className = 'fa-solid fa-volume-xmark';
        } else {
          volumeIcon.className = 'fa-solid fa-volume-high';
        }
      }

      if (muteToggle) {
        muteToggle.addEventListener('click', (e) => {
          e.stopPropagation();
          bgVideo.muted = !bgVideo.muted;
          updateVolumeIcon();
        });
      }

      // Fullscreen Toggle
      if (fullscreenToggle) {
        fullscreenToggle.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch((err) => {
              console.warn('Fullscreen error:', err);
            });
            fullscreenIcon.className = 'fa-solid fa-compress';
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen();
            }
            fullscreenIcon.className = 'fa-solid fa-expand';
          }
        });
      }

      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
          fullscreenIcon.className = 'fa-solid fa-expand';
        } else {
          fullscreenIcon.className = 'fa-solid fa-compress';
        }
      });
    });
  </script>
</body>
</html>
